# 河流水质站日 CSV 发布服务：两个实例共享同一卷，验证跨实例并发安全。
# 启动：docker compose up --build
# 实例 A 文档：http://localhost:8001/docs   实例 B 文档：http://localhost:8002/docs
# 扩容演示：发满 128 件后，对任一实例 POST /capacity/expand（两实例同时
#           调用只生效一次），容量升到 256 件，可从第 129 件续发。
services:
  release-a:
    build: .
    image: water-quality-release:latest
    environment:
      DATA_DIR: /data
      MAX_FILE_BYTES: "1048576"   # 单件 1 MiB
      # 仅全新卷的初始上限：累计 128 件，对应 Merkle 树深度 7。
      # 运行期容量持久化在共享卷 SQLite meta 表，扩容后为 256（深度 8），
      # 重启后以卷上状态为准，本环境变量不会覆盖已扩容的卷。
      MAX_RELEASES: "128"
    ports:
      - "8001:8000"
    volumes:
      - shared-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  release-b:
    image: water-quality-release:latest
    build: .
    environment:
      DATA_DIR: /data
      MAX_FILE_BYTES: "1048576"
      MAX_RELEASES: "128"
    ports:
      - "8002:8000"
    volumes:
      - shared-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      - release-a

volumes:
  shared-data:
